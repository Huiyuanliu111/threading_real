name: threading_arp
_target_: threading_task.workspace.ThreadingARPWorkspace

task:
  dataset:
    _target_: threading_task.dataset.ThreadingImageDataset
    dataset_path: data/threading/threading_d0.hdf5
    horizon: 50
    pad_before: 1
    pad_after: 7
    seed: 42
    val_ratio: 0.2
    max_train_episodes: null
    max_frames_per_ep: null
    joint_key: robot0_joint_pos
    gripper_key: robot0_gripper_qpos
    camera_keys: [agentview_image, robot0_eye_in_hand_image]
    image_size: 96
    n_obs_steps: ${policy.n_obs_steps}
  env_runner:
    _target_: threading_task.env_runner.ThreadingImageRunner
    output_dir: ${hydra:runtime.output_dir}
    dataset_path: ${task.dataset.dataset_path}
    env_name: Threading_D0
    n_eval_episodes: 10
    max_steps: 400
    test_start_seed: 10000
    n_video_episodes: 3
    video_fps: 20
    video_size: 256
    joint_key: ${task.dataset.joint_key}
    gripper_key: ${task.dataset.gripper_key}
    camera_keys: ${task.dataset.camera_keys}
  image_shape: [3, 96, 96]
  name: threading_image
  shape_meta: &shape_meta
    action: {shape: [7]}
    obs:
      agent_pos: {shape: [9], type: low_dim}
      top45: {shape: [3, 96, 96], type: rgb}
      sideview: {shape: [3, 96, 96], type: rgb}

dataloader: {batch_size: 32, num_workers: 4, persistent_workers: true, pin_memory: true, shuffle: true}
val_dataloader: {batch_size: 32, num_workers: 4, persistent_workers: true, pin_memory: true, shuffle: false}

training:
  checkpoint_every: 5
  debug: false
  device: cuda:0
  enable_rollout: true
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 100
  max_train_steps: null
  max_val_steps: 20
  num_epochs: 150
  resume: false
  resume_path: null
  rollout_every: 25
  sample_every: 50
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 10
  stop_at_epoch: 150

ema:
  _target_: pushbox.diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

optimizer:
  betas: [0.95, 0.999]
  lr: 0.0001
  obs_encoder_weight_decay: 1.0e-06
  transformer_weight_decay: 0.001

logging:
  group: null
  id: null
  mode: online
  name: threading_arp
  entity: huiyuan_tac
  project: adaptive_chunk
  tags: [threading, mimicgen, arp]

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt
    k: 3
    mode: min
    monitor_key: val_loss

policy:
  _target_: pushbox.policy.PushBoxARPolicy
  shape_meta: *shape_meta
  crop_shape: [84, 84]
  eval_fixed_crop: true
  obs_encoder_group_norm: true
  pretrained: true
  freeze_obs_encoder: true
  horizon: 20
  n_action_steps: 20
  n_obs_steps: 2
  arp_cfg:
    plan_steps: 0
    plan_chunk_size: 0
    action_chunk_size: 20
    num_latents: 5
    layer_norm_every_block: false
    n_embd: 64
    embd_pdrop: 0.1
    num_layers: 6
    layer_cfg:
      n_head: 8
      mlp_ratio: 4.0
      AdaLN: true
      mlp_dropout: 0.1
      attn_kwargs: {attn_pdrop: 0.1, resid_pdrop: 0.1}
      cond_attn_kwargs: {attn_pdrop: 0.1, resid_pdrop: 0.1}
    sample: true
    augment_ratio: 0.0
    low_var_eval: true
