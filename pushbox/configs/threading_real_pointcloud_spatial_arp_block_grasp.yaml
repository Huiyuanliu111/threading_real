name: threading_real_pointcloud_spatial_arp_block_grasp
_target_: pushbox.workspace.PushBoxARPWorkspace

task:
  dataset:
    _target_: threading_task.pointcloud_dataset.ThreadingPointCloudSpatialDataset
    dataset_path: /home/huiyuan/teleoperation/data/block_grasp_pointcloud_full_v2_stride5.h5
    urdf_path: /home/huiyuan/teleoperation/remote_controller/src/remote_controller/assets/panda/panda_arm.urdf
    horizon: 10
    n_obs_steps: 1
    val_ratio: 0.2
    seed: 42
    split_strategy: spatial_farthest
    # Exclude late approach frames where the robot itself discloses the target.
    episode_end_fraction: 0.65
    goal_backoff_frames: 0
    max_points: 4096
    bev_size: 64
    bev_bounds: [0.28, -0.15, -0.15, 0.56, 0.10, 0.20]
  name: threading_real_pointcloud_spatial_block_grasp
  shape_meta:
    action: {shape: [7]}
    obs:
      points: {shape: [4096, 3], type: low_dim}
      colors: {shape: [4096, 3], type: low_dim}
      camera_id: {shape: [4096], type: low_dim}
      bev: {shape: [7, 64, 64], type: low_dim}
      agent_pos: {shape: [8], type: low_dim}
      tcp_pos: {shape: [3], type: low_dim}

dataloader:
  batch_size: 8
  num_workers: 2
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  multiprocessing_context: spawn
  shuffle: true

val_dataloader:
  batch_size: 8
  num_workers: 1
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  multiprocessing_context: spawn
  shuffle: false

training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  resume_optimizer: true
  resume_path: null
  use_ema: true
  lr_scheduler: cosine
  lr_num_cycles: 1
  lr_warmup_steps: 200
  gradient_accumulate_every: 2
  # This 20-episode set starts overfitting after roughly epoch 10.
  num_epochs: 12
  stop_at_epoch: 12
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  val_every: 2
  sample_every: 1000
  checkpoint_every: 2

ema:
  _target_: pushbox.diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

optimizer:
  lr: 0.0003
  betas: [0.9, 0.999]
  transformer_weight_decay: 0.0001

policy:
  _target_: threading_task.bev_spatial_policy.ThreadingBEVSpatialARPolicy
  point_bounds: [0.28, -0.15, -0.15, 0.56, 0.10, 0.20]
  goal_bounds: [0.30, -0.13, -0.09, 0.54, 0.08, -0.02]
  bev_size: 64
  action_mode: cartesian_delta
  horizon: 10
  n_action_steps: 5
  n_obs_steps: 1
  hidden_dim: 96
  heatmap_loss_weight: 1.0
  xy_loss_weight: 30.0
  z_loss_weight: 20.0
  max_bev_translation: 10
  bev_noise_std: 0.02
  max_translation_step: 0.008
  stop_distance: 0.003
  max_goal_distance: 0.25
  min_confidence: 0.001
  close_distance: 0.012
  closed_width: 0.012
  gripper_target_width: 0.0
  post_grasp_lift_height: 0.05

logging:
  project: adaptive_chunk
  entity: huiyuan_tac
  group: null
  id: null
  mode: offline
  name: threading_real_pointcloud_spatial_arp_block_grasp
  tags: [threading_real, spatial_arp, pointcloud, block_grasp, stride5]

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt'
    k: 3
    mode: min
    monitor_key: val_loss
