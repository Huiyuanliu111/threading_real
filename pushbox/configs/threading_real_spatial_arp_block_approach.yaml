# Vision-forced spatial policy for the 20-episode minimal block approach set.
# Requires fixed-camera projection calibration generated by:
#   python scripts/calibrate_threading_spatial.py ...
name: threading_real_spatial_arp_block_approach
_target_: pushbox.workspace.PushBoxARPWorkspace

task:
  dataset:
    _target_: threading_task.dataset.ThreadingSpatialLeRobotDataset
    dataset_path: /home/huiyuan/teleoperation/data/block_grasp_minimal_lerobot_v3_cartesian_stride5_224
    calibration_path: /home/huiyuan/teleoperation/threading_real/calibration/block_grasp_spatial.json
    urdf_path: /home/huiyuan/teleoperation/remote_controller/src/remote_controller/assets/panda/panda_arm.urdf
    spatial_camera_keys: [sideview, frontview]
    goal_backoff_frames: 0
    goal_tcp_offset: [0.0, 0.0, 0.0]
    horizon: 2
    pad_before: 1
    pad_after: 0
    seed: 42
    val_ratio: 0.2
    max_train_episodes: null
    max_frames_per_ep: null
    camera_keys: [observation.images.exterior_image_2_right, observation.images.wrist_image_left, observation.images.exterior_image_1_left]
    camera_output_keys: [sideview, wrist, frontview]
    image_size: 224
    n_obs_steps: ${policy.n_obs_steps}
    state_key: observation.state
    action_key: action
    action_mode: cartesian_delta
    max_cached_video_episodes: 2
    temporal_stride: 5
    episode_end_fraction: 1.0
    drop_waiting: true
    wait_translation_threshold: 0.001
    wait_rotation_threshold: 0.01
    wait_gripper_threshold: 0.0005
    wait_min_run_frames: 15
    wait_keep_boundary_frames: 2
  image_shape: [3, 224, 224]
  name: threading_real_spatial_block_approach
  shape_meta: &shape_meta
    action: {shape: [7]}
    obs:
      agent_pos: {shape: [8], type: low_dim}
      tcp_pos: {shape: [3], type: low_dim}
      sideview: {shape: [3, 224, 224], type: rgb}
      wrist: {shape: [3, 224, 224], type: rgb}
      frontview: {shape: [3, 224, 224], type: rgb}

dataloader:
  batch_size: 8
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  multiprocessing_context: spawn
  shuffle: true

val_dataloader:
  batch_size: 8
  num_workers: 2
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  multiprocessing_context: spawn
  shuffle: false

training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  resume_optimizer: true
  resume_path: null
  use_ema: true
  lr_scheduler: cosine
  lr_num_cycles: 1
  lr_warmup_steps: 300
  gradient_accumulate_every: 4
  num_epochs: 60
  stop_at_epoch: 60
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  val_every: 2
  # The base workspace's sample metric compares against per-step BC actions,
  # which is not meaningful for a terminal-goal spatial controller.
  sample_every: 1000
  checkpoint_every: 2

ema:
  _target_: pushbox.diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

optimizer:
  lr: 0.0001
  betas: [0.9, 0.999]
  transformer_weight_decay: 0.0001
  obs_encoder_weight_decay: 0.000001
  obs_encoder_lr: 0.000003
  obs_projection_lr: 0.0001

policy:
  _target_: threading_task.spatial_policy.ThreadingSpatialARPolicy
  shape_meta: *shape_meta
  calibration_path: ${task.dataset.calibration_path}
  spatial_camera_keys: [sideview, frontview]
  action_mode: cartesian_delta
  horizon: 1
  n_action_steps: 1
  n_obs_steps: 2
  backbone: resnet18
  pretrained: true
  freeze_obs_encoder: false
  obs_encoder_group_norm: true
  hidden_dim: 192
  transformer_layers: 4
  transformer_heads: 8
  dropout: 0.1
  heatmap_size: 56
  heatmap_sigma: 1.5
  triangulation_loss_weight: 10.0
  max_translation_step: 0.008
  stop_distance: 0.003
  max_goal_distance: 0.20
  min_heatmap_confidence: 0.002
  image_augmentation:
    brightness: 0.10
    contrast: 0.10
    saturation: 0.05
    noise_std: 0.005
    translate: 0.0

logging:
  project: adaptive_chunk
  entity: huiyuan_tac
  group: null
  id: null
  mode: offline
  name: threading_real_spatial_arp_block_approach
  tags: [threading_real, spatial_arp, block_approach, heatmap, triangulation]

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt'
    k: 3
    mode: min
    monitor_key: val_loss
