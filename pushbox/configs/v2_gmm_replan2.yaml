name: v2_gmm_replan2
_target_: threading_task.workspace.ThreadingARPWorkspace

task:
  dataset:
    _target_: threading_task.dataset.ThreadingImageDataset
    dataset_path: data/threading/threading_d0.hdf5
    horizon: 26
    pad_before: 1
    pad_after: 24
    seed: 42
    val_ratio: 0.2
    max_validation_sequences: 4000
    max_train_episodes: null
    max_frames_per_ep: null
    state_mode: eef
    joint_key: robot0_joint_pos
    gripper_key: robot0_gripper_qpos
    eef_pos_key: robot0_eef_pos
    eef_quat_key: robot0_eef_quat
    camera_keys: [agentview_image, robot0_eye_in_hand_image]
    camera_output_keys: [top45, wrist]
    image_sizes: [84, 84]
    image_size: 84
    n_obs_steps: ${policy.n_obs_steps}
  env_runner:
    _target_: threading_task.env_runner.ThreadingImageRunner
    output_dir: ${hydra:runtime.output_dir}
    dataset_path: ${task.dataset.dataset_path}
    env_name: Threading_D0
    n_eval_episodes: 10
    max_steps: 1000
    test_start_seed: 10000
    n_video_episodes: 3
    video_fps: 20
    video_size: 256
    state_mode: ${task.dataset.state_mode}
    joint_key: ${task.dataset.joint_key}
    gripper_key: ${task.dataset.gripper_key}
    eef_pos_key: ${task.dataset.eef_pos_key}
    eef_quat_key: ${task.dataset.eef_quat_key}
    camera_keys: ${task.dataset.camera_keys}
    camera_output_keys: ${task.dataset.camera_output_keys}
    camera_sizes: ${task.dataset.image_sizes}
  image_shape: [3, 84, 84]
  name: threading_image_v2
  shape_meta: &shape_meta
    action: {shape: [7]}
    obs:
      agent_pos: {shape: [8], type: low_dim}
      top45: {shape: [3, 84, 84], type: rgb}
      wrist: {shape: [3, 84, 84], type: rgb}

dataloader: {batch_size: 8, num_workers: 4, persistent_workers: true, pin_memory: true, shuffle: true}
val_dataloader: {batch_size: 8, num_workers: 4, persistent_workers: true, pin_memory: true, shuffle: false}

training:
  checkpoint_every: 1
  debug: false
  device: cuda:0
  enable_rollout: true
  gradient_accumulate_every: 4
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 20
  resume: false
  resume_path: null
  rollout_every: 1
  sample_every: 1
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
  stop_at_epoch: 20

ema:
  _target_: pushbox.diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

optimizer:
  betas: [0.9, 0.999]
  lr: 1.0e-4
  obs_encoder_lr: 1.0e-5
  obs_projection_lr: 1.0e-4
  obs_encoder_weight_decay: 1.0e-6
  transformer_weight_decay: 0.001

logging:
  group: null
  id: null
  mode: online
  name: v2_gmm_replan2
  entity: huiyuan_tac
  project: adaptive_chunk
  tags: [threading, mimicgen, arp, two-view, eef-state, gmm, replan2, horizon20]

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-rollout_sr={rollout_sr:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: rollout_sr

policy:
  _target_: threading_task.policy.ThreadingARPolicy
  shape_meta: *shape_meta
  camera_obs_keys: [agentview_image, robot0_eye_in_hand_image]
  backbone: resnet18
  obs_encoder_group_norm: true
  pretrained: true
  freeze_obs_encoder: false
  use_view_fusion: false
  image_augmentation:
    brightness: 0.15
    contrast: 0.15
    saturation: 0.10
  horizon: 20
  n_action_steps: 2
  n_obs_steps: 2
  arp_cfg:
    plan_steps: 4
    plan_chunk_size: 1
    action_chunk_size: 20
    action_predictor: gmm
    num_latents: 1
    layer_norm_every_block: true
    n_embd: 256
    embd_pdrop: 0.1
    num_layers: 8
    layer_cfg:
      n_head: 8
      mlp_ratio: 4.0
      AdaLN: true
      mlp_dropout: 0.1
      attn_kwargs: {attn_pdrop: 0.1, resid_pdrop: 0.1}
      cond_attn_kwargs: {attn_pdrop: 0.1, resid_pdrop: 0.1}
    sample: false
    augment_ratio: 0.0
    low_var_eval: true
