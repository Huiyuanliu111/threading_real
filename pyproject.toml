[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pushbox"
version = "0.1.0"
description = "Custom robosuite environment for box-pushing with Franka Emika Panda"
requires-python = ">=3.10"
dependencies = [
    # Simulation
    "robosuite>=1.5.2",
    "mujoco>=3.9.0",
    # Numerics
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    # RL / training
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "gymnasium>=0.29.0",
    "tensorboard>=2.14.0",
    # Data
    "lerobot>=0.4.0",
    "h5py>=3.10.0",
    "pyarrow>=15.0.0",
    # Utilities
    "opencv-python>=4.11.0",
    "tqdm>=4.67.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pushbox*", "envs*", "threading_task*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
