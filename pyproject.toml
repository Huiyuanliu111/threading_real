[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threading-real"
version = "0.1.0"
description = "Real-robot Threading training and deployment with ARP and pi0.5"
requires-python = ">=3.10"
dependencies = [
    # Numerics
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    # RL / training
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tensorboard>=2.14.0",
    # Data
    "lerobot>=0.4.0",
    "h5py>=3.10.0",
    "pyarrow>=15.0.0",
    # Utilities
    "opencv-python>=4.11.0",
    "tqdm>=4.67.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pushbox*", "threading_task*", "chunk_selector*", "pi05*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
